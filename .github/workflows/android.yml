# 이 파일을 .github/workflows/android.yml 로 옮겨서 사용하세요. (옮긴 뒤 이 파일은 삭제해도 됩니다)
# 사용법: git tag app-v1.0.0 && git push origin app-v1.0.0  ->  APK 가 서명되어 Releases 에 올라갑니다.
name: android-apk

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "수동 실행용 버전 (예: 1.0.0). 수동 실행은 Release 대신 Artifacts 로 받습니다."
        default: "0.0.1"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 버전 결정
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#app-v}"; else V="${{ inputs.version }}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "빌드 버전: $V"

      - name: 서명 키 Secrets 확인
        env:
          A: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          B: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          C: ${{ secrets.ANDROID_KEY_ALIAS }}
          D: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          miss=""
          [ -z "$A" ] && miss="$miss ANDROID_KEYSTORE_BASE64"
          [ -z "$B" ] && miss="$miss ANDROID_KEYSTORE_PASSWORD"
          [ -z "$C" ] && miss="$miss ANDROID_KEY_ALIAS"
          [ -z "$D" ] && miss="$miss ANDROID_KEY_PASSWORD"
          if [ -n "$miss" ]; then
            echo "::error::GitHub Secrets 에 다음 값이 없어요:$miss  (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android_app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 서버 테스트 (화면/API 가 깨진 채로 앱을 만들지 않도록)
        run: |
          pip install -r requirements-server.txt -r requirements-dev.txt
          python -m pytest -q tests/test_core.py tests/test_api.py

      - name: 화면 파일 복사 + 안드로이드 프로젝트 생성
        working-directory: android_app
        run: |
          pip install pillow
          python scripts/prepare_android.py web
          npm ci
          npx cap add android
          python scripts/prepare_android.py patch --version "$VERSION"
          npx cap sync android

      - name: APK 빌드
        working-directory: android_app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK 서명
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          UNSIGNED=$(ls android_app/android/app/build/outputs/apk/release/*.apk | head -1)
          echo "unsigned: $UNSIGNED"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT="TodoManager-${VERSION}.apk"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT" | head -3
          rm -f "$RUNNER_TEMP/release.jks"
          sha256sum "$OUT"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Release 에 APK 첨부
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILE }}
          name: "안드로이드 앱 ${{ env.VERSION }}"
          make_latest: "false"
          body: |
            일정 관리 안드로이드 앱 ${{ env.VERSION }}

            설치: 폰에서 이 APK 를 받아 열면 됩니다. (처음이면 "출처를 알 수 없는 앱 설치 허용"을 켜야 해요)
            처음 실행하면 서버 PC 의 Tailscale 주소(예: 100.x.x.x:8765)를 입력하세요.
            업데이트: 새 APK 를 같은 방식으로 설치하면 덮어써집니다. (데이터는 서버에 있어서 그대로예요)

      - name: 수동 실행이면 Artifacts 로 업로드
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}
