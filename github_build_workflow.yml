name: build-client
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-client.txt -r requirements-server.txt -r requirements-dev.txt pyinstaller
      - name: Test
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build exe
        run: pyinstaller --noconfirm --noconsole --name TodoManager todo_client.py
      - name: Zip
        run: Compress-Archive -Path dist/TodoManager -DestinationPath TodoManager-win.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TodoManager-win
          path: TodoManager-win.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TodoManager-win.zip
